# packages/_groups.conf
# Group definitions, metadata (description, optional, cond), and package execution order.

[group:core]
description = Core utilities, shell essentials, version control
optional = false
packages = bash-completion, git, git-lfs, gpg, curl, wget, tar, zip, unzip, 7z, zstd, procps, file, stow, swap

[group:package-managers]
description = Runtime and tool version managers
optional = true
packages = mise

[group:shell]
description = Prompts, multiplexers, and terminal tools
# Note: sesh complements tmux session management. herdr acts as an alternative session manager (alt = tmux).
optional = true
packages = starship, tmux, fzf, zoxide, atuin, ripgrep, fd, sd, bat, eza, duf, dust, procs, bottom, delta, rip2, herdr, sesh, ttyd

[group:runtimes]
description = Compilers and language runtimes
optional = true
packages = uv, python3, node, bun, golang, rust, build-essential, clang, cmake, ninja, ccache, gdb, sdkman, java, kotlin, dotnet

[group:sys-info]
description = System monitoring and hardware inspection
optional = true
packages = ncdu, inxi, lshw, bandwhich

[group:security-and-net]
description = SSH, VPNs, tunnels, and secret management
optional = true
packages = ssh, sshd, ufw, crowdsec, tailscale, cloudflared, bore, caddy, mosh, age, gopass

[group:dev-tools]
description = Containers, developer tools, and build utilities
optional = true
packages = docker, docker-compose, podman, podman-compose, dokploy, gh, gitbutler, jq, direnv, hyperfine, grex, just

[group:utilities]
description = File sync and network utilities
optional = true
packages = fastfetch, rsync, rclone, croc, xh, gping, tealdeer, asciinema

[group:ai-agents]
description = Coding agents and LLM runners
optional = true
packages = claude-code-cli, codex-cli, opencode-cli, cursor-cli, antigravity-cli, github-copilot-cli, grok-build, kilo-code-cli, muse-code, ollama, llama-cpp
