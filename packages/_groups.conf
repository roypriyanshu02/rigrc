# packages/_groups.conf
# Group definitions, metadata (description, optional, cond), and package execution order.

[group:core]
description = Core utilities, version control, archive tools, and shell essentials
optional = false
packages = bash-completion, git, git-lfs, gpg, curl, wget, tar, zip, unzip, 7z, zstd, procps, file, stow, swap

[group:package-managers]
description = Version managers for runtimes and tools
optional = true
packages = mise

[group:shell]
description = Terminal utilities, prompts, multiplexers, and search tools
# Note: sesh complements tmux session management. herdr acts as an alternative session manager (alt = tmux).
optional = true
packages = starship, tmux, fzf, zoxide, atuin, ripgrep, fd, sd, bat, eza, duf, dust, procs, bottom, delta, rip2, herdr, sesh, ttyd

[group:runtimes]
description = Compilers, build systems, and language runtimes
optional = true
packages = uv, python3, node, bun, deno, golang, rust, build-essential, clang, cmake, ninja, ccache, gdb, sdkman, java, kotlin, dotnet

[group:sys-info]
description = Hardware inspection, system monitoring, and network diagnostics
optional = true
packages = ncdu, inxi, lshw, bandwhich

[group:security-and-net]
description = Firewalls, intrusion prevention, VPNs, tunnels, and secret management
optional = true
packages = ssh, sshd, ufw, crowdsec, tailscale, cloudflared, bore, caddy, mosh, age, gopass

[group:dev-tools]
description = Container runtimes, developer CLIs, benchmarking, and build tools
optional = true
packages = docker, docker-compose, podman, podman-compose, dokploy, gh, jq, direnv, hyperfine, grex, just

[group:utilities]
description = System utilities, network monitoring, and HTTP tools
optional = true
packages = fastfetch, rsync, rclone, croc, xh, gping, tealdeer, asciinema

[group:ai-agents]
description = Coding agents, AI assistants, and LLM runners
optional = true
packages = claude-code-cli, cursor-cli, antigravity-cli, ollama, codex-cli, opencode-cli
