[package]
name = just
binaries = just
description = Command runner inspired by make
scope = system
apt = just
dnf = just
pacman = just
optional = true

[template:~/.config/just/justfile:once]
# Starter utility recipes (accessible anywhere via: just -g <recipe> or j <recipe>)

doctor:
    @echo "Checking system tools..."
    @command -v git >/dev/null && echo "  [ok] git" || echo "  [missing] git"
    @command -v curl >/dev/null && echo "  [ok] curl" || echo "  [missing] curl"
    @command -v direnv >/dev/null && echo "  [ok] direnv" || echo "  [missing] direnv"
    @command -v gh >/dev/null && echo "  [ok] gh" || echo "  [missing] gh"
    @command -v podman >/dev/null && echo "  [ok] podman" || echo "  [missing] podman"
    @command -v docker >/dev/null && echo "  [ok] docker" || echo "  [missing] docker"
    @command -v just >/dev/null && echo "  [ok] just" || echo "  [missing] just"

clean:
    @echo "Cleaning temporary files..."
    @rm -rf ~/.cache/tmp 2>/dev/null || true

update:
    @echo "Updating system..."
    @if command -v apt >/dev/null 2>&1; then sudo apt update && sudo apt upgrade -y; \
     elif command -v dnf >/dev/null 2>&1; then sudo dnf check-update && sudo dnf upgrade -y; \
     elif command -v pacman >/dev/null 2>&1; then sudo pacman -Syu --noconfirm; \
     fi

[bashrc]
if command -v just >/dev/null 2>&1; then
    _eval_cached just just --completions bash 2>/dev/null || true
    alias jg='just -g'
fi
