[package]
name = direnv
binaries = direnv
description = Directory environment switcher
scope = system
apt = direnv
dnf = direnv
pacman = direnv
optional = true

[template:~/.config/direnv/direnv.toml:once]
[global]
load_dotenv = true
strict_env = false
warn_timeout = "5s"

[whitelist]
prefix = ["~/dev", "~/projects", "~/code", "~/work"]

[bashrc]
if command -v direnv >/dev/null 2>&1; then
    _eval_cached direnv direnv hook bash
fi
