[package]
name = docker
binaries = docker
description = Container runtime and toolchain
scope = system
apt = docker-ce
dnf = docker-ce
pacman = docker
apt.prep = if [ ! -f /etc/apt/keyrings/docker.asc ] || [ ! -f /etc/apt/sources.list.d/docker.sources ]; then sudo apt update && sudo apt install -y ca-certificates curl && sudo install -m 0755 -d /etc/apt/keyrings && sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && sudo chmod a+r /etc/apt/keyrings/docker.asc && CODENAME=$(. /etc/os-release && echo ${UBUNTU_CODENAME:-$VERSION_CODENAME}); ARCH=$(dpkg --print-architecture); printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' $CODENAME $ARCH | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null && sudo apt update; fi
dnf.prep = if [ ! -f /etc/yum.repos.d/docker-ce.repo ]; then sudo dnf -y install dnf-plugins-core && sudo dnf config-manager addrepo --from-repofile https://download.docker.com/linux/fedora/docker-ce.repo; fi
post = sudo systemctl enable --now docker.socket 2>/dev/null || sudo systemctl enable --now docker; [ -n '$USER' ] && sudo usermod -aG docker $USER 2>/dev/null || true
alt = podman
rec = desktop
cond = !container,!wsl
optional = true

[template:~/.docker/config.json:once]
{
  "detachKeys": "ctrl-e,e"
}

[template:/etc/docker/daemon.json:once:cond=!container,!wsl:post=sudo systemctl try-reload-or-restart docker 2>/dev/null || true]
{
  "log-driver": "local",
  "log-opts": {
    "max-size": "10m",
    "max-file": "3"
  },
  "live-restore": true,
  "userland-proxy": false,
  "no-new-privileges": true
}

[bashrc]
export DOCKER_BUILDKIT=1
export COMPOSE_DOCKER_CLI_BUILD=1
if command -v docker >/dev/null 2>&1; then
    _eval_cached docker docker completion bash 2>/dev/null || true
fi
