[package]
name = hyperfine
binaries = hyperfine
description = CLI benchmarking tool
scope = user
cargo = hyperfine
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:sharkdp/hyperfine || { command -v cargo-binstall >/dev/null 2>&1 && cargo binstall --no-confirm hyperfine; } || { command -v cargo >/dev/null 2>&1 && cargo install hyperfine; } || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:sharkdp/hyperfine; }
optional = true

[bashrc]
if command -v hyperfine >/dev/null 2>&1; then
    _eval_cached hyperfine hyperfine --generate-shell-completion bash 2>/dev/null || true
fi
