[package]
name = gh
binaries = gh
description = GitHub official command line tool
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g gh@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g gh@latest; }
needs = mise
optional = true

[template:~/.config/gh/config.yml:once]
git_protocol: ssh
prompt: enabled
aliases:
  co: pr checkout
  pv: pr view
telemetry: disabled

[bashrc]
if command -v gh >/dev/null 2>&1; then
    _eval_cached gh gh completion -s bash 2>/dev/null || true
fi
