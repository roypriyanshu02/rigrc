[package]
name = docker-compose
binaries = docker-compose
description = Multi-container Docker manager
scope = system
apt = docker-compose-plugin
dnf = docker-compose-plugin
pacman = docker-compose
post = if ! command -v docker-compose >/dev/null 2>&1; then for p in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose; do if [ -x $p ]; then sudo ln -sf $p /usr/local/bin/docker-compose; break; fi; done; fi
cmd = set -e; ARCH=$(uname -m); case $ARCH in x86_64) A=x86_64;; aarch64|arm64) A=aarch64;; *) echo 'Unsupported architecture' >&2; exit 1;; esac; V=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/docker/compose/releases/latest); V=${V##*/}; sudo install -d -m 0755 /usr/local/lib/docker/cli-plugins; sudo curl -fsSL https://github.com/docker/compose/releases/download/${V}/docker-compose-linux-${A} -o /usr/local/lib/docker/cli-plugins/docker-compose; sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose; sudo ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
needs = docker
alt = podman-compose
cond = !container,!wsl
optional = true
