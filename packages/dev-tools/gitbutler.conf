[package]
name = gitbutler
binaries = but
description = Branch manager and Git client
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://gitbutler.com/install.sh | sh
needs = git,curl
optional = true

[template:~/.config/gitbutler/settings.json:once]
{
  "$schema": "https://raw.githubusercontent.com/gitbutlerapp/gitbutler/master/crates/but-settings/assets/defaults.jsonc",
  "telemetry": {
    "appMetricsEnabled": false,
    "appErrorReportingEnabled": false
  },
  "fetch": {
    "autoFetchIntervalMinutes": 15
  },
  "ai": {
    "autoBranchNaming": false,
    "autoCommitMessage": false
  }
}

[template:~/.config/git/gitbutler.gitconfig:once]
[gitbutler]
	signCommits = true

[but.alias]
	st = status
	df = diff
	sh = show
	op = oplog
	br = branch
	brn = branch new
	co = branch switch
	app = apply
	unapp = unapply
	ci = commit
	cia = commit --ai
	am = amend
	abs = absorb
	sq = squash
	rew = reword
	uncom = uncommit
	ps = push
	pl = pull
	prn = pr new
	un = undo
	re = redo
	res = resolve

[bashrc]
# GitButler CLI environment and completions
if command -v but >/dev/null 2>&1; then
    _eval_cached but but completions bash 2>/dev/null || true

    alias b='but'
    alias bs='but status'
    alias bci='but commit'
    alias bca='but commit --ai'
    alias bb='but branch'
    alias bbn='but branch new'
    alias bapp='but apply'
    alias bunapp='but unapply'
    alias babs='but absorb'
    alias bam='but amend'
    alias bsq='but squash'
    alias bundo='but undo'
    alias bredo='but redo'
    alias bop='but oplog'
    alias btui='but tui'
    alias bpr='but pr new'
fi
