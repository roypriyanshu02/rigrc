[package]
name = dokploy
binaries = dokploy
description = Self-hosted PaaS deployment engine
scope = system
cmd = curl -fsSL https://dokploy.com/install.sh | sudo sh && printf '%s\n' '#!/usr/bin/env bash' 'echo Dokploy PaaS is active on http://localhost:3000' 'sudo docker ps --filter name=dokploy' | sudo tee /usr/local/bin/dokploy >/dev/null && sudo chmod +x /usr/local/bin/dokploy
needs = docker
cond = !container,!wsl
optional = true
