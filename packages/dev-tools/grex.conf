[package]
name = grex
binaries = grex
description = Regular expression generator from example inputs
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:pemistahl/grex || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:pemistahl/grex; }
needs = mise
optional = true
