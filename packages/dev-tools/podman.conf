[package]
name = podman
binaries = podman
description = Daemonless container engine for OCI containers
scope = system
apt = podman
dnf = podman
pacman = podman
post = command -v systemctl >/dev/null 2>&1 && systemctl --user enable --now podman.socket 2>/dev/null || true
alt = docker
cond = !container
optional = true

[template:~/.config/containers/containers.conf:once]
[containers]
cgroups = "enabled"
log_driver = "k8s-file"
log_size_max = 10485760

[engine]
cgroup_manager = "systemd"
events_logger = "journald"

[bashrc]
if command -v podman >/dev/null 2>&1; then
    _eval_cached podman podman completion bash 2>/dev/null || true
fi
