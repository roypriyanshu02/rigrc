[package]
name = deno
binaries = deno
description = Secure TypeScript and JavaScript runtime
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g deno@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g deno@latest; }
needs = mise
alt = node,bun
optional = true

[bashrc]
if command -v deno >/dev/null 2>&1; then
    _eval_cached deno deno completions bash 2>/dev/null || true
fi
