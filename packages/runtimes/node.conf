[package]
name = node
binaries = node,npm,npx
description = Node.js JavaScript runtime
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g node@lts || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g node@lts; }
needs = mise
alt = bun,deno
optional = true

[template:~/.config/npm/npmrc:once]
fund=false
audit-level=high

[bashrc]
export NPM_CONFIG_USERCONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/npm/npmrc"
export NODE_REPL_HISTORY="${XDG_STATE_HOME:-$HOME/.local/state}/node_repl_history"
