[package]
name = python3
binaries = python3,python
description = Python 3 interpreter
scope = user
cmd = ~/.local/bin/uv python install
needs = uv
post = mkdir -p "${XDG_BIN_HOME:-$HOME/.local/bin}" && ln -sf "$(${HOME}/.local/bin/uv python find 2>/dev/null || uv python find 2>/dev/null)" "${XDG_BIN_HOME:-$HOME/.local/bin}/python3" && ln -sf "${XDG_BIN_HOME:-$HOME/.local/bin}/python3" "${XDG_BIN_HOME:-$HOME/.local/bin}/python"
optional = true

[bashrc]
export PYTHON_HISTORY="${XDG_STATE_HOME:-$HOME/.local/state}/python/history"
export PYTHONPYCACHEPREFIX="${XDG_CACHE_HOME:-$HOME/.cache}/cpython"
export PYTHONUSERBASE="${XDG_DATA_HOME:-$HOME/.local/share}/python"
[ -d "$PYTHONUSERBASE/bin" ] && [[ ":$PATH:" != *":$PYTHONUSERBASE/bin:"* ]] && export PATH="$PYTHONUSERBASE/bin:$PATH"
