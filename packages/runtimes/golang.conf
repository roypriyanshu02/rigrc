[package]
name = golang
binaries = go,gofmt
description = Go programming language compiler and tools
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g go@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g go@latest; }
needs = mise
optional = true

[template:~/.config/go/env:once]
GOPROXY=https://proxy.golang.org,direct
GOSUMDB=sum.golang.org

[bashrc]
export GOPATH="${XDG_DATA_HOME:-$HOME/.local/share}/go"
export GOBIN="$GOPATH/bin"
export PATH="$GOBIN:$PATH"
export GOENV="${XDG_CONFIG_HOME:-$HOME/.config}/go/env"
if command -v go >/dev/null 2>&1; then
    _eval_cached go go env 2>/dev/null || true
fi
