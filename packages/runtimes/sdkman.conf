[package]
name = sdkman
binaries = sdk,sdkman
description = SDKMAN! polyglot candidate and toolchain manager
scope = user
cmd = export SDKMAN_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/sdkman"; curl --proto '=https' --tlsv1.2 -sSfL "https://get.sdkman.io?ci=true" | bash
optional = true

[bashrc]
export SDKMAN_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/sdkman"
if [ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
    . "$SDKMAN_DIR/bin/sdkman-init.sh"
fi
