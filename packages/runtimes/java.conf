[package]
name = java
binaries = java,javac
description = OpenJDK Java runtime and SDK
scope = user
cmd = export SDKMAN_DIR="${SDKMAN_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/sdkman}"; [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ] && [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] && SDKMAN_DIR="$HOME/.sdkman"; . "$SDKMAN_DIR/bin/sdkman-init.sh" && sdkman_auto_answer=true sdk install java
needs = sdkman
optional = true

[bashrc]
if [ -d "${SDKMAN_DIR:-$HOME/.local/share/sdkman}/candidates/java/current" ]; then
    export JAVA_HOME="${SDKMAN_DIR:-$HOME/.local/share/sdkman}/candidates/java/current"
elif command -v mise >/dev/null 2>&1 && mise where java >/dev/null 2>&1; then
    export JAVA_HOME="$(mise where java 2>/dev/null)"
fi
