[package]
name = ccache
binaries = ccache
description = Compiler cache for fast C/C++ recompilation
scope = system
apt = ccache
dnf = ccache
pacman = ccache
optional = true

[template:~/.config/ccache/ccache.conf:once]
max_size = 5G
compression = true

[bashrc]
export CCACHE_CONFIGPATH="${XDG_CONFIG_HOME:-$HOME/.config}/ccache/ccache.conf"
export CCACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/ccache"
