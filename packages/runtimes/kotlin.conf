[package]
name = kotlin
binaries = kotlin,kotlinc
description = Kotlin programming language compiler
scope = user
cmd = export SDKMAN_DIR="${SDKMAN_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/sdkman}"; [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ] && [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ] && SDKMAN_DIR="$HOME/.sdkman"; . "$SDKMAN_DIR/bin/sdkman-init.sh" && sdkman_auto_answer=true sdk install kotlin
needs = sdkman
optional = true
