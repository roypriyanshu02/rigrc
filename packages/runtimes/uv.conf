[package]
name = uv
binaries = uv,uvx
description = Fast Python package installer and resolver
scope = user
cmd = curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=${XDG_BIN_HOME:-$HOME/.local/bin} sh
optional = true

[template:~/.config/uv/uv.toml:once]
# System Python isolation and speed optimizations
python-preference = "managed"
python-downloads = "automatic"
compile-bytecode = true
concurrent-downloads = 8

[bashrc]
if command -v uv >/dev/null 2>&1; then
    _eval_cached uv uv generate-shell-completion bash 2>/dev/null || true
fi
