[package]
name = rust
binaries = rustc,cargo
description = Rust language toolchain
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g rust@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g rust@latest; }
needs = mise
optional = true

[template:~/.local/share/cargo/config.toml:once]
[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true

[bashrc]
export CARGO_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/cargo"
export RUSTUP_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/rustup"
export PATH="$CARGO_HOME/bin:$PATH"
if [ "${ENABLE_RUST_CCACHE:-1}" = "1" ] && command -v ccache >/dev/null 2>&1; then
    export RUSTC_WRAPPER=ccache
fi
