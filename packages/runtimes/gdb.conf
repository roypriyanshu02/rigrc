[package]
name = gdb
binaries = gdb
description = GNU Project Debugger
scope = system
apt = gdb
dnf = gdb
pacman = gdb
post = mkdir -p ${XDG_STATE_HOME:-$HOME/.local/state}/gdb 2>/dev/null || true
optional = true

[template:~/.config/gdb/gdbinit:once]
set history save on
set history size 10000
set history filename ~/.local/state/gdb/history
set print pretty on
set pagination off
