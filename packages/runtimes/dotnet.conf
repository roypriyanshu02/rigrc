[package]
name = dotnet
binaries = dotnet
description = .NET SDK and developer platform
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g dotnet@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g dotnet@latest; }
needs = mise
optional = true

[bashrc]
export DOTNET_CLI_TELEMETRY_OPTOUT=1
if command -v dotnet >/dev/null 2>&1; then
    _eval_cached dotnet dotnet completions bash 2>/dev/null || true
fi
