[package]
name = bun
binaries = bun,bunx
description = JavaScript runtime and toolkit
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g bun@latest || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g bun@latest; }
needs = mise
alt = node
optional = true

[bashrc]
if command -v bun >/dev/null 2>&1; then
    _eval_cached bun bun completions 2>/dev/null || true
fi
