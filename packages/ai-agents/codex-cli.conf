[package]
name = codex-cli
binaries = codex
description = OpenAI Codex coding assistant
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://chatgpt.com/codex/install.sh | env CODEX_NON_INTERACTIVE=1 sh
optional = true

[template:~/.codex/config.toml:once]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[bashrc]
# OpenAI Codex CLI shortcuts
command -v codex >/dev/null 2>&1 && alias cdx='codex'
