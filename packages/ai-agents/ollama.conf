[package]
name = ollama
binaries = ollama
description = Local LLM model runner
scope = system
timeout = 900
cmd = curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/ollama_install.sh https://ollama.com/install.sh && sudo sh /tmp/ollama_install.sh && rm -f /tmp/ollama_install.sh
alt = llama-cpp
optional = true

# Host binding configuration specifying 127.0.0.1:11434 and localhost origins for CSRF security.
# OLLAMA_MAX_LOADED_MODELS=1 and OLLAMA_NUM_PARALLEL=1 are VPS-specific limits to prevent OOM
# on RAM-constrained hosts, whereas personal desktop nodes can omit these overrides to permit
# concurrent model loading and request serving.
[template:/etc/systemd/system/ollama.service.d/override.conf:once:cond=!container:post=sudo systemctl daemon-reload && sudo systemctl try-restart ollama || true]
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_ORIGINS=http://127.0.0.1:*,http://localhost:*"
# Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Environment="OLLAMA_NUM_PARALLEL=1"

[bashrc]
# Ollama aliases and helper functions
command -v ollama >/dev/null 2>&1 && alias ol='ollama'
command -v ollama >/dev/null 2>&1 && alias ollama-ls='ollama list'
command -v ollama >/dev/null 2>&1 && alias ollama-ps='ollama ps'
