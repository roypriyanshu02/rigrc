[package]
name = kilo-code-cli
binaries = kilo,kilo-code
description = Kilo Code agentic engineering CLI
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://kilo.ai/cli/install | bash
optional = true

[template:~/.config/kilo/kilo.jsonc:once]
{
  "$schema": "https://app.kilo.ai/config.json",
  "permission": {
    "bash": "ask",
    "read": "allow",
    "edit": "ask",
    "webfetch": "ask"
  }
}

[bashrc]
# Kilo Code CLI environment and shortcuts
[[ -d "$HOME/.kilo/bin" ]] && export PATH="$HOME/.kilo/bin:$PATH"
command -v kilo >/dev/null 2>&1 && alias kl='kilo'
