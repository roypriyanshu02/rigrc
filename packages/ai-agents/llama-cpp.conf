[package]
name = llama-cpp
binaries = llama,llama-server,llama-cli
description = Local LLM inference server
scope = user
pacman = llama.cpp
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://llama.app/install.sh | bash
needs = curl
alt = ollama
optional = true

[template:~/.config/llama.cpp/config.ini:once]
[*]
ctx-size = 8192
n-gpu-layers = 999
flash-attn = 1
mmap = 1
threads = -1

# Model presets (downloaded from Hugging Face on first manual invocation)
[qwen-coder]
hf = ggml-org/Qwen2.5-Coder-7B-Instruct-GGUF
ctx-size = 16384
temp = 0.2

[llama3]
hf = ggml-org/Meta-Llama-3.1-8B-Instruct-GGUF
ctx-size = 8192
temp = 0.7

[template:~/.config/llama.cpp/server.env:once]
LLAMA_ARG_HOST=127.0.0.1
LLAMA_ARG_PORT=8080
LLAMA_ARG_CTX_SIZE=8192
LLAMA_ARG_N_GPU_LAYERS=999
LLAMA_ARG_FLASH_ATTN=1
LLAMA_ARG_PARALLEL=1
LLAMA_ARG_ENDPOINT_METRICS=1
# Default model loaded by background service (Hugging Face repo or local path)
LLAMA_ARG_HF_REPO=ggml-org/Qwen2.5-Coder-7B-Instruct-GGUF

[template:~/.config/systemd/user/llama-server.service:once:cond=!container:post=systemctl --user daemon-reload 2>/dev/null || true]
[Unit]
Description=llama.cpp Local Inference Server (OpenAI Compatible API)
Documentation=https://llama.app https://github.com/ggml-org/llama.cpp
After=network.target

[Service]
Type=simple
Environment="LLAMA_CACHE=%h/.cache/llama.cpp"
EnvironmentFile=-%h/.config/llama.cpp/server.env
ExecStart=/bin/sh -c 'if command -v llama >/dev/null 2>&1; then exec llama serve; elif command -v llama-server >/dev/null 2>&1; then exec llama-server; else echo "llama binary not found in PATH" >&2; exit 1; fi'
Restart=on-failure
RestartSec=5s
Nice=5
LimitNOFILE=65536
KillMode=process

[Install]
WantedBy=default.target

[bashrc]
# llama.cpp & llama.app environment and aliases
export LLAMA_CACHE="${LLAMA_CACHE:-$HOME/.cache/llama.cpp}"

if command -v llama >/dev/null 2>&1 || command -v llama-server >/dev/null 2>&1 || command -v llama-cli >/dev/null 2>&1; then
    if command -v llama >/dev/null 2>&1; then
        alias llama-serve='llama serve'
        alias llama-chat='llama cli -cnv --jinja'
    elif command -v llama-server >/dev/null 2>&1; then
        alias llama-serve='llama-server'
        alias llama-chat='llama-cli -cnv --jinja'
    fi

    # Systemd service management helpers
    alias llama-srv-start='systemctl --user start llama-server'
    alias llama-srv-stop='systemctl --user stop llama-server'
    alias llama-srv-restart='systemctl --user restart llama-server'
    alias llama-srv-status='systemctl --user status llama-server'
    alias llama-logs='journalctl --user -u llama-server -f -o cat'

    # Model inspection and status helpers
    llama-models() {
        local cache_dir="${LLAMA_CACHE:-$HOME/.cache/llama.cpp}"
        if [ -d "$cache_dir" ]; then
            echo "Cached models in $cache_dir:"
            find "$cache_dir" -type f -name "*.gguf" -exec du -h {} + 2>/dev/null || true
        else
            echo "Cache directory $cache_dir does not exist."
        fi
    }

    llama-ps() {
        local endpoint="${1:-http://127.0.0.1:8080}"
        if command -v curl >/dev/null 2>&1; then
            echo "== Server Health =="
            curl -s "${endpoint}/health" 2>/dev/null || echo "Server not reachable at ${endpoint}"
            echo ""
            echo "== Loaded Models =="
            if command -v jq >/dev/null 2>&1; then
                curl -s "${endpoint}/v1/models" 2>/dev/null | jq .
            else
                curl -s "${endpoint}/v1/models" 2>/dev/null
            fi
        fi
    }
fi
