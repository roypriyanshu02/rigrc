[package]
name = grok-build
binaries = grok,grok-build
description = xAI Grok Build coding agent
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://x.ai/cli/install.sh | bash
optional = true

[template:~/.grok/config.toml:once]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[bashrc]
# xAI Grok Build CLI environment and shortcuts
[[ -d "$HOME/.grok/bin" ]] && export PATH="$HOME/.grok/bin:$PATH"
command -v grok >/dev/null 2>&1 && alias grk='grok'
