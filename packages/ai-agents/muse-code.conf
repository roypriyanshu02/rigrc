[package]
name = muse-code
binaries = muse,muse-code
description = Meta Muse Code terminal coding agent
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://dev.meta.ai/install.sh | bash
optional = true

[template:~/.config/muse/settings.json:once]
{
  "schema_version": 1,
  "permissions": {
    "terminalExecution": "ask",
    "workspaceAccessOnly": true
  }
}

[bashrc]
# Meta Muse Code CLI environment and shortcuts
[[ -d "$HOME/.muse/bin" ]] && export PATH="$HOME/.muse/bin:$PATH"
command -v muse >/dev/null 2>&1 && alias mc='muse'
