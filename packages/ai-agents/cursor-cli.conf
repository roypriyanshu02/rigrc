[package]
name = cursor-cli
binaries = cursor-agent,cursor
description = Cursor CLI coding assistant
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://cursor.com/install | bash
optional = true

[template:~/.cursor/cli-config.json:once]
{
  "permissions": {
    "allow": [],
    "deny": [
      "Read(~/.ssh/**)",
      "Read(~/.aws/**)",
      "Read(~/.azure/**)",
      "Read(~/.config/gcloud/**)",
      "Read(~/.gnupg/**)",
      "Read(~/.kube/**)",
      "Read(~/.docker/**)",
      "Read(~/.npmrc)",
      "Read(~/.pypirc)",
      "Read(~/.terraform.d/**)",
      "Read(~/.config/rclone/**)",
      "Read(.env*)",
      "Read(**/*.pem)",
      "Read(**/*.key)",
      "Read(**/secrets/**)"
    ]
  },
  "requireApproval": true,
  "autoApprove": false
}

[bashrc]
# Cursor agent shortcuts
command -v cursor-agent >/dev/null 2>&1 && alias cur='cursor-agent'
