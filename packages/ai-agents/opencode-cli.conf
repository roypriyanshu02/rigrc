[package]
name = opencode-cli
binaries = opencode
description = OpenCode coding assistant
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://opencode.ai/install | bash
optional = true

[template:~/.config/opencode/opencode.json:once]
{
  "$schema": "https://opencode.ai/config.json",
  "shell": "/bin/bash",
  "permission": {
    "edit": "ask",
    "bash": "ask"
  }
}

[bashrc]
# OpenCode CLI environment and shortcuts
[[ -d "$HOME/.opencode/bin" ]] && export PATH="$HOME/.opencode/bin:$PATH"
command -v opencode >/dev/null 2>&1 && alias opc='opencode'
