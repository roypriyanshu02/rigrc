[package]
name = antigravity-cli
binaries = agy,antigravity
description = Google Antigravity coding agent
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://antigravity.google/cli/install.sh | bash
optional = true

[template:~/.gemini/antigravity-cli/settings.json:once]
{
  "model": "auto",
  "terminalExecution": "review",
  "workspaceAccessOnly": true
}

[bashrc]
# Google Antigravity CLI environment and aliases
[[ -d "$HOME/.gemini/antigravity-cli/bin" ]] && export PATH="$HOME/.gemini/antigravity-cli/bin:$PATH"
command -v agy >/dev/null 2>&1 && alias agy-review='agy --review'
