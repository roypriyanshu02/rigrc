[package]
name = github-copilot-cli
binaries = copilot,github-copilot
description = GitHub Copilot CLI coding assistant
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://gh.io/copilot-install | bash
optional = true

[template:~/.copilot/settings.json:once]
{
  "terminalExecution": "ask",
  "fileWrite": "ask"
}

[bashrc]
# GitHub Copilot CLI environment and shortcuts
[[ -d "$HOME/.copilot/bin" ]] && export PATH="$HOME/.copilot/bin:$PATH"
command -v copilot >/dev/null 2>&1 && alias ghcp='copilot'
