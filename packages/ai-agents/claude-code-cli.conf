[package]
name = claude-code-cli
binaries = claude
description = Claude Code coding agent
scope = user
cmd = curl --proto '=https' --tlsv1.2 -fsSL https://claude.ai/install.sh | bash
optional = true

[template:~/.claude/settings.json:once]
{
  "sandbox": true,
  "permissions": {
    "deny": [
      "Read(~/.ssh/**)",
      "Read(~/.aws/**)",
      "Read(~/.azure/**)",
      "Read(~/.config/gcloud/**)",
      "Read(~/.gnupg/**)",
      "Read(~/.kube/**)",
      "Read(~/.docker/**)",
      "Read(~/.npmrc)",
      "Read(~/.pypirc)",
      "Read(~/.terraform.d/**)",
      "Read(~/.config/rclone/**)",
      "Read(.env*)",
      "Read(**/*.pem)",
      "Read(**/*.key)",
      "Read(**/secrets/**)"
    ]
  }
}

[bashrc]
# Claude Code shortcuts (guarded against collisions)
command -v claude >/dev/null 2>&1 && alias cl='claude'
