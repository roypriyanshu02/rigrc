[package]
name = fastfetch
binaries = fastfetch
description = System information and hardware summary tool
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:fastfetch-cli/fastfetch || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:fastfetch-cli/fastfetch; }
needs = mise
cond = !vps
optional = true

[template:~/.config/fastfetch/config.jsonc:once]
{
  "modules": [
    "title",
    "separator",
    "os",
    "kernel",
    "uptime",
    "shell",
    "terminal",
    "cpu",
    "memory",
    "disk",
    {
      "type": "battery",
      "key": " "
    }
  ]
}

[bashrc]
if command -v fastfetch >/dev/null 2>&1; then
    alias ff='fastfetch'
fi
case $- in
    *i*)
        if [ -z "$TMUX" ] && [ -z "$CI" ] && [ -t 1 ]; then
            fastfetch 2>/dev/null || true
        fi
        ;;
esac
