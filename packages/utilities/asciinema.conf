[package]
name = asciinema
binaries = asciinema
description = Terminal session recorder and player
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:asciinema/asciinema || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:asciinema/asciinema; }
needs = mise
optional = true

[template:~/.config/asciinema/config:once]
# Note: asciinema recordings capture raw terminal output including any secrets displayed on-screen
[record]
idle_time_limit = 2.0
