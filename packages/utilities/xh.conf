[package]
name = xh
binaries = xh
description = Modern HTTP client
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:ducaale/xh || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:ducaale/xh; }
needs = mise
alt = curl,httpie
optional = true

[bashrc]
if command -v xh >/dev/null 2>&1; then
    _eval_cached xh xh --generate complete-bash 2>/dev/null || true
fi
