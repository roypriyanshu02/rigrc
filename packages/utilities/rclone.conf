[package]
name = rclone
binaries = rclone
description = Cloud storage sync tool
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:rclone/rclone || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:rclone/rclone; }
needs = mise
alt = rsync
optional = true

post = mkdir -p -m 700 ~/.config/rclone 2>/dev/null || true; [ -f ~/.config/rclone/rclone.conf ] && chmod 600 ~/.config/rclone/rclone.conf 2>/dev/null || true

# Security Note:
# ~/.config/rclone/rclone.conf contains OAuth tokens and cloud storage credentials.
# Set RCLONE_CONFIG_PASS in environment to encrypt the config file at rest,
# preventing plaintext tokens even with chmod 600 permissions.

[bashrc]
if command -v rclone >/dev/null 2>&1; then
    _eval_cached rclone rclone completion bash 2>/dev/null || true
fi
