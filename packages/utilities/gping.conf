[package]
name = gping
binaries = gping
description = Ping with graph visualization
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:orf/gping || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:orf/gping; }
post = hash -r 2>/dev/null || true; BIN=$(command -v gping 2>/dev/null || echo ~/.local/share/mise/installs/gping/latest/bin/gping); [ -x $BIN ] && sudo setcap cap_net_raw+ep $BIN 2>/dev/null || true
needs = mise
alt = ping
optional = true
