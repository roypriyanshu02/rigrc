[package]
name = tealdeer
binaries = tldr
description = Fast tldr client for simplified man pages
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g tealdeer || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g tealdeer; }
post = command -v tldr >/dev/null 2>&1 && tldr --update 2>/dev/null || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise exec -- tldr --update 2>/dev/null; } || true
needs = mise
alt = man
optional = true

[template:~/.config/tealdeer/config.toml:once]
[display]
use_pager = true

[updates]
auto_update = false

[bashrc]
alias tldru='tldr --update'
