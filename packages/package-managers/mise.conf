[package]
name = mise
binaries = mise
description = Dev tools and runtime version manager
scope = user
cmd = curl https://mise.run | sh
optional = true

[template:~/.config/mise/config.toml:once]
[settings]
trusted_config_paths = ["~/dev", "~/projects", "~/code", "~/work"]
experimental = false
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go", "java"]
not_found_auto_install = false
lockfile = true

[settings.status]
# Keep statusline quiet by default
show_tools = false

[bashrc]
export PATH="${XDG_DATA_HOME:-$HOME/.local/share}/mise/shims:$PATH"
if command -v _eval_cached >/dev/null 2>&1; then
    _eval_cached mise mise activate bash
    _eval_cached mise_comp mise completion bash 2>/dev/null || true
elif command -v mise >/dev/null 2>&1; then
    eval "$(mise activate bash 2>/dev/null || true)"
fi
if command -v mise >/dev/null 2>&1; then
    alias mx='mise x --'
    alias mr='mise run'
    alias mu='mise use'
    alias mug='mise use -g'
    alias mls='mise ls'
    alias mout='mise outdated'
fi
