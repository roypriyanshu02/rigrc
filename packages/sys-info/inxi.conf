[package]
name = inxi
binaries = inxi
description = Full-featured CLI system information tool
scope = system
apt = inxi
dnf = inxi
pacman = inxi
optional = true

[template:~/.config/inxi.conf:once]
B_SHOW_HOST=false

[bashrc]
if command -v inxi >/dev/null 2>&1; then
    alias inxi-full='inxi -Fz'
    alias inxi-cpu='inxi -C'
    alias inxi-disk='inxi -D'
    alias inxi-net='inxi -N'
    alias inxi-gpu='inxi -G'
fi
