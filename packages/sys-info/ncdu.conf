[package]
name = ncdu
binaries = ncdu
description = NCurses disk usage analyzer
scope = system
apt = ncdu
dnf = ncdu
pacman = ncdu
optional = true

[template:~/.config/ncdu/config:once]
--disable-delete
--color dark

[bashrc]
if command -v ncdu >/dev/null 2>&1; then
    alias ncdu-fast='ncdu --exclude-kernfs -x'
fi
