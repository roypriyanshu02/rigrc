[package]
name = bandwhich
binaries = bandwhich
description = Network bandwidth monitor
scope = system
dnf = bandwhich
pacman = bandwhich
dnf.prep = sudo dnf copr enable atim/bandwhich -y
cmd = set -e; ARCH=$(uname -m); case $ARCH in x86_64) A=x86_64-unknown-linux-musl;; aarch64|arm64) A=aarch64-unknown-linux-musl;; armv7l|armv7) A=armv7-unknown-linux-musleabihf;; *) echo 'bandwhich: unsupported architecture: '$ARCH >&2; exit 1;; esac; V=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/imsnif/bandwhich/releases/latest); V=${V##*/}; T=$(mktemp -d); trap 'rm -rf $T' EXIT INT TERM; curl -fsSL -o $T/bandwhich.tar.gz https://github.com/imsnif/bandwhich/releases/download/${V}/bandwhich-${V}-${A}.tar.gz || { echo 'Download failed' >&2; exit 1; }; tar xzf $T/bandwhich.tar.gz -C $T || { echo 'Extract failed' >&2; exit 1; }; [ -x $T/bandwhich ] || { echo 'Binary not found' >&2; exit 1; }; sudo install -m 755 $T/bandwhich /usr/local/bin/bandwhich
post = hash -r 2>/dev/null || true; BIN=$(command -v bandwhich 2>/dev/null || echo /usr/local/bin/bandwhich); if ! [ -f /.dockerenv ] && ! [ -f /run/.containerenv ] && [ -x "$BIN" ]; then sudo setcap cap_sys_ptrace,cap_dac_read_search,cap_net_raw,cap_net_admin+ep "$BIN" 2>/dev/null || true; fi
# Note: setcap grants network capture capabilities directly to the binary for zero-sudo execution
optional = true

[bashrc]
if command -v bandwhich >/dev/null 2>&1; then
    alias bwhich='bandwhich'
fi
