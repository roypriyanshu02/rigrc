[package]
name = lshw
binaries = lshw
description = Hardware configuration tool
scope = system
apt = lshw
dnf = lshw
pacman = lshw
optional = true

# Note: lshw requires root privileges for comprehensive DMI/bus reporting; -sanitize scrubs MAC addresses and serial numbers.
[bashrc]
if command -v lshw >/dev/null 2>&1; then
    alias lshw-short='sudo lshw -short -sanitize'
    alias lshw-json='sudo lshw -json -sanitize'
fi
