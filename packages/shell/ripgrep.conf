[package]
name = ripgrep
binaries = rg
description = Fast line-oriented search tool
scope = system
apt = ripgrep
dnf = ripgrep
pacman = ripgrep
alt = grep
optional = true

[template:~/.config/ripgrep/config:once]
--smart-case

[bashrc]
export RIPGREP_CONFIG_PATH="${XDG_CONFIG_HOME:-$HOME/.config}/ripgrep/config"
