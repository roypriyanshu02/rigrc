[package]
name = sesh
binaries = sesh
description = Smart terminal session manager for tmux
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:joshmedeski/sesh || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:joshmedeski/sesh; }
alt = tmux,herdr
needs = tmux,mise
optional = true

[template:~/.config/sesh/sesh.toml:once]
[default_session]
startup_command = "nvim"
preview_command = "if command -v eza >/dev/null 2>&1; then eza --all --git --icons --color=always {}; else ls -la {}; fi"

[[wildcard]]
pattern = "~/dev/*"
startup_command = "nvim"
