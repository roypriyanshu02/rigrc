[package]
name = fzf
binaries = fzf
description = Command-line fuzzy finder
scope = system
apt = fzf
dnf = fzf
pacman = fzf
optional = true

[bashrc]
if command -v fzf >/dev/null 2>&1; then
    _eval_cached fzf fzf --bash 2>/dev/null || true
    [ -f "$HOME/.fzfrc" ] && source "$HOME/.fzfrc"
    fbr() {
        local branch
        branch=$(git branch --all 2>/dev/null | grep -v HEAD | fzf | sed 's/.* //;s#remotes/[^/]*/##')
        [ -n "$branch" ] && git checkout "$branch"
    }
    fkill() {
        local pid
        pid=$(ps aux | fzf -m --header-lines=1 | awk '{print $2}')
        [ -n "$pid" ] && echo "$pid" | xargs -r kill
    }
    fkill9() {
        local pid
        pid=$(ps aux | fzf -m --header-lines=1 | awk '{print $2}')
        [ -n "$pid" ] && echo "$pid" | xargs -r kill -9
    }
fi

[template:~/.fzfrc:once]
export FZF_DEFAULT_OPTS="--height=60% --layout=reverse --border=rounded --preview-window=right:60%:wrap --bind='ctrl-/:toggle-preview' --color=fg:#c0caf5,bg:-1,hl:#7aa2f7 --color=fg+:#c0caf5,bg+:#292e42,hl+:#7dcfff"
if command -v fd >/dev/null 2>&1; then
    export FZF_DEFAULT_COMMAND="fd --type f --strip-cwd-prefix --hidden --exclude .git"
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
    export FZF_ALT_C_COMMAND="fd --type d --strip-cwd-prefix --hidden --exclude .git"
fi
if command -v bat >/dev/null 2>&1; then
    export FZF_CTRL_T_OPTS="--preview 'bat --style=numbers --color=always --line-range :200 {}'"
fi
if command -v eza >/dev/null 2>&1; then
    export FZF_ALT_C_OPTS="--preview 'eza --tree --level=2 --color=always {}'"
fi
