[package]
name = starship
binaries = starship
description = Cross-shell customizable prompt
scope = user
cmd = curl --proto '=https' --tlsv1.2 -sSf https://starship.rs/install.sh | sh -s -- --yes --bin-dir ${XDG_BIN_HOME:-$HOME/.local/bin}
optional = true

[template:~/.config/starship.toml:once]
add_newline = false
command_timeout = 500
format = "$all"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[bashrc]
if command -v starship >/dev/null 2>&1; then
    _eval_cached starship starship init bash --print-full-init
fi
