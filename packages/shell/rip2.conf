[package]
name = rip2
binaries = rip
description = Safe deletion with undo
scope = system
cmd = set -e; ARCH=$(uname -m); case $ARCH in x86_64) A=x86_64-musl;; aarch64|arm64) A=aarch64-musl;; armv7l|armv7|armv6l|armv6|arm) A=arm-musl;; i386|i686) A=i686-musl;; *) echo 'rip: unsupported architecture: '$ARCH >&2; exit 1;; esac; V=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/MilesCranmer/rip2/releases/latest); V=${V##*/}; T=$(mktemp -d); trap 'rm -rf $T' EXIT INT TERM; curl -fsSL -o $T/rip2.tar.gz https://github.com/MilesCranmer/rip2/releases/download/${V}/rip-Linux-${A}.tar.gz || { echo 'Download failed' >&2; exit 1; }; tar xzf $T/rip2.tar.gz -C $T || { echo 'Extract failed' >&2; exit 1; }; sudo install -m 755 $T/rip /usr/local/bin/rip
alt = rm
optional = true
