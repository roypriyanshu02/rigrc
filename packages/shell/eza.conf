[package]
name = eza
binaries = eza
description = Modern file listing tool
scope = system
apt = eza
dnf = eza
pacman = eza
alt = ls
optional = true

[template:~/.config/eza/theme.yml:once]
colour_palette:
  directory: { foreground: Blue }
  executable: { foreground: Green }
  symlink: { foreground: Cyan }
