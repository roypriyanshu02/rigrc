[package]
name = atuin
binaries = atuin
description = Shell history sync and search tool
scope = user
cmd = ATUIN_NO_MODIFY_PATH=1 curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive
optional = true

[bashrc]
[ -d "$HOME/.atuin/bin" ] && [[ ":$PATH:" != *":$HOME/.atuin/bin:"* ]] && export PATH="$HOME/.atuin/bin:$PATH"
if command -v atuin >/dev/null 2>&1; then
    _eval_cached atuin atuin init bash --disable-up-arrow
fi

[template:~/.config/atuin/config.toml:once]
# Local-only fuzzy history search by default; set auto_sync = true with registered account for cross-device sync
auto_sync = false
secrets_filter = true
search_mode = "fuzzy"
sync_frequency = "1h"
enter_accept = false
