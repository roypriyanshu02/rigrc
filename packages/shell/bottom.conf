[package]
name = bottom
binaries = btm
description = Graphical process and system monitor
scope = system
dnf = bottom
pacman = bottom
dnf.prep = sudo dnf copr enable atim/bottom -y
apt.cmd = set -e; ARCH=$(dpkg --print-architecture); case $ARCH in amd64|arm64|armhf) ;; *) echo 'bottom: unsupported architecture: '$ARCH >&2; exit 1;; esac; V=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/ClementTsang/bottom/releases/latest); V=${V##*/}; T=$(mktemp --suffix=.deb); trap 'rm -f $T' EXIT INT TERM; curl -fsSL -o $T https://github.com/ClementTsang/bottom/releases/download/${V}/bottom_${V#v}-1_${ARCH}.deb && sudo apt-get install -y $T
alt = top,htop
optional = true

[template:~/.config/bottom/bottom.toml:once]
[flags]
rate = "1s"
temperature_type = "celsius"
