[package]
name = sd
binaries = sd
description = Find and replace tool
scope = system
pacman = sd
cmd = set -e; ARCH=$(uname -m); case $ARCH in x86_64) A=x86_64-unknown-linux-musl;; aarch64|arm64) A=aarch64-unknown-linux-musl;; armv7l|armv7) A=armv7-unknown-linux-gnueabihf;; armv6l|armv6|arm) A=arm-unknown-linux-gnueabihf;; *) echo 'sd: unsupported architecture: '$ARCH >&2; exit 1;; esac; V=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/chmln/sd/releases/latest); V=${V##*/}; T=$(mktemp -d); trap 'rm -rf $T' EXIT INT TERM; curl -fsSL -o $T/sd.tar.gz https://github.com/chmln/sd/releases/download/${V}/sd-${V}-${A}.tar.gz || { echo 'Download failed' >&2; exit 1; }; tar xzf $T/sd.tar.gz -C $T || { echo 'Extract failed' >&2; exit 1; }; [ -x $T/sd-${V}-${A}/sd ] || { echo 'Binary not found' >&2; exit 1; }; sudo install -m 755 $T/sd-${V}-${A}/sd /usr/local/bin/sd
alt = sed
optional = true
