[package]
name = delta
binaries = delta
description = Syntax-highlighting diff pager
scope = system
apt = git-delta
dnf = git-delta
pacman = git-delta
needs = git
alt = diff
optional = true

[template:~/.config/git/delta.gitconfig:once]
[core]
	pager = delta

[interactive]
	diffFilter = delta --color-only

[delta]
	navigate = true
	side-by-side = true
	line-numbers = true
