[package]
name = curl
binaries = curl
description = HTTP transfer tool
scope = system
apt = curl
dnf = curl
pacman = curl

[template:~/.config/curl/.curlrc:once]
# ── Security & Protocol Restrictions ──────────────────────────────────────────
proto-default = "https"
proto-redir = "-all,https,http"

# ── Timeouts & Retry Strategies ───────────────────────────────────────────────
connect-timeout = 10
max-time = 120
retry = 3
retry-delay = 2
retry-connrefused

# ── Output & Behavior ─────────────────────────────────────────────────────────
location
fail-with-body
silent
show-error

[bashrc]
export CURL_HOME="${XDG_CONFIG_HOME:-$HOME/.config}/curl"
myip() {
    curl -fsSL --proto '=https' --max-time 5 https://ifconfig.me 2>/dev/null || curl -fsSL --proto '=https' --max-time 5 https://icanhazip.com 2>/dev/null
    echo
}
