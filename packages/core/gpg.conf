[package]
name = gpg
binaries = gpg
description = GnuPG encryption and signing
scope = system
apt = gnupg
dnf = gnupg2
pacman = gnupg
post = chmod 700 ~/.gnupg 2>/dev/null || true

[template:~/.gnupg/gpg.conf:once]
# ── Security Hardening ────────────────────────────────────────────────────────
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256
require-cross-certification
no-symkey-cache
use-agent

# ── Privacy Options ───────────────────────────────────────────────────────────
no-comments
no-emit-version
# throw-keyids hides recipient key IDs (anonymity), but requires trying all secret keys on decryption
throw-keyids

# ── UX & Display Preferences ──────────────────────────────────────────────────
charset utf-8
no-greeting
keyid-format 0xlong
list-options show-uid-validity
verify-options show-uid-validity
with-fingerprint

[template:~/.gnupg/gpg-agent.conf:once]
pinentry-program ~/.local/bin/pinentry-smart
default-cache-ttl 600
max-cache-ttl 7200

[template:~/.local/bin/pinentry-smart:once:post=chmod +x ~/.local/bin/pinentry-smart 2>/dev/null || true]
#!/bin/sh
# Dynamic Pinentry selector (GUI vs Curses fallback)
if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
    if command -v pinentry-gnome3 >/dev/null 2>&1; then
        exec pinentry-gnome3 "$@"
    elif command -v pinentry-qt >/dev/null 2>&1; then
        exec pinentry-qt "$@"
    elif command -v pinentry-gtk-2 >/dev/null 2>&1; then
        exec pinentry-gtk-2 "$@"
    elif command -v pinentry-x11 >/dev/null 2>&1; then
        exec pinentry-x11 "$@"
    fi
fi

if command -v pinentry-curses >/dev/null 2>&1; then
    exec pinentry-curses "$@"
elif command -v pinentry-tty >/dev/null 2>&1; then
    exec pinentry-tty "$@"
elif [ -x /usr/bin/pinentry ]; then
    exec /usr/bin/pinentry "$@"
else
    exec pinentry "$@"
fi

[bashrc]
if [ -t 0 ]; then
    export GPG_TTY="$(tty 2>/dev/null || true)"
fi
