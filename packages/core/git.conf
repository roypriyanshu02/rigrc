[package]
name = git
binaries = git
description = Git version control
scope = system
apt = git
dnf = git
pacman = git

[template:~/.config/git/config:once]
[init]
	defaultBranch = main

[fetch]
	prune = true
	pruneTags = true

[push]
	autoSetupRemote = true
	followTags = true

[rerere]
	enabled = true

[pull]
	rebase = true

[credential]
	helper = cache --timeout=3600

[core]
	autocrlf = input
	excludesfile = ~/.config/git/ignore
	attributesfile = ~/.config/git/attributes

[commit]
	verbose = true

[branch]
	sort = -committerdate

[tag]
	sort = version:refname

[column]
	ui = auto

[help]
	autocorrect = prompt

[diff]
	algorithm = histogram
	colorMoved = default

[merge]
	conflictstyle = zdiff3

[include]
	path = ~/.config/git/delta.gitconfig
	path = ~/.config/git/gitbutler.gitconfig

[alias]
	st = status -sb
	co = checkout
	last = log -1 HEAD --stat
	amend = commit --amend --no-edit
	unstage = restore --staged

[template:~/.config/git/ignore:once]
*.swp
*.swo
*~
*.log
__pycache__/
*.pyc
.direnv/
*.orig
.idea/
.vscode/
.DS_Store
Thumbs.db

[template:~/.config/git/attributes:once]
* text=auto eol=lf

