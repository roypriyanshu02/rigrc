[package]
name = wget
binaries = wget
description = File download utility
scope = system
apt = wget
dnf = wget
pacman = wget

[template:~/.config/wget/wgetrc:once]
# ── Network & Timeouts ────────────────────────────────────────────────────────
tries = 3
timeout = 30
connect_timeout = 10
read_timeout = 30
waitretry = 2
retry_connrefused = on

# ── Security & HSTS ───────────────────────────────────────────────────────────
# Store HSTS cache in XDG cache directory instead of $HOME/.wget-hsts
hsts-file = ~/.cache/wget-hsts

# ── UX & Display ──────────────────────────────────────────────────────────────
show_progress = on
progress = bar:force

[bashrc]
export WGETRC="${XDG_CONFIG_HOME:-$HOME/.config}/wget/wgetrc"
