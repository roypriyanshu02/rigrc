[package]
name = swap
binaries = swapon
description = Automatic swap-file allocation for low-RAM VPS instances
scope = script
cond = vps,!container
optional = true
cmd = true
post = mem=$(free -m 2>/dev/null | awk '/Mem:/ {print $2}'); swap=$(free -m 2>/dev/null | awk '/Swap:/ {print $2}'); if [ ${mem:-0} -lt 4096 ] 2>/dev/null && [ ${swap:-0} -eq 0 ] 2>/dev/null; then sz=$(( mem < 1024 ? 1024 : (mem > 4096 ? 4096 : mem) )); (sudo fallocate -l ${sz}M /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=$sz 2>/dev/null) && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null 2>&1 && sudo swapon /swapfile >/dev/null 2>&1 && (grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null); fi && (sudo sysctl -p /etc/sysctl.d/99-swappiness.conf 2>/dev/null || true)

[template:/etc/sysctl.d/99-swappiness.conf:once:cond=vps,!container:post=sudo sysctl -p /etc/sysctl.d/99-swappiness.conf 2>/dev/null || true]
vm.swappiness = 10
