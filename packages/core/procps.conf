[package]
name = procps
binaries = ps,top,free,vmstat,pkill,pgrep
description = Process management utilities
scope = system
apt = procps
dnf = procps-ng
pacman = procps-ng

[bashrc]
if command -v ps >/dev/null 2>&1; then
    alias psmem='ps aux --sort=-%mem | head -n 11'
    alias pscpu='ps aux --sort=-%cpu | head -n 11'
fi
