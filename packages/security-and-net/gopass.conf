[package]
name = gopass
binaries = gopass
description = Team-driven password manager for command line
scope = user
cmd = command -v mise >/dev/null 2>&1 && mise use -g github:gopasspw/gopass || { [ -x $HOME/.local/bin/mise ] && $HOME/.local/bin/mise use -g github:gopasspw/gopass; }
needs = mise
optional = true

[template:~/.config/gopass/config.yml:once]
# autoclip copies secret to clipboard; relying on gopass auto-clear timeout for protection
autoclip: true
autoimport: false
clippath: ""
notifications: true

[bashrc]
if command -v gopass >/dev/null 2>&1; then
    _eval_cached gopass gopass completion bash 2>/dev/null || true
fi
