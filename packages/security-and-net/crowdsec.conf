[package]
name = crowdsec
binaries = crowdsec
description = Open-source collaborative intrusion detection engine
scope = system
apt = crowdsec
dnf = crowdsec
apt.prep = curl -s https://install.crowdsec.net | sudo sh
dnf.prep = curl -s https://install.crowdsec.net | sudo sh
cond = vps,!wsl,!container,!arch
optional = true
post = if command -v cscli >/dev/null 2>&1; then sudo cscli hub update && sudo cscli collections install crowdsecurity/sshd && sudo cscli collections install crowdsecurity/linux && sudo systemctl reload crowdsec; fi
