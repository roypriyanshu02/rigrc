[package]
name = sshd
binaries = sshd
description = OpenSSH server configuration
scope = system
apt = openssh-server
dnf = openssh-server
pacman = openssh
cond = vps,!wsl,!container
optional = true
# Automatic restart of sshd is intentionally omitted to prevent VPS lockout.
# Test configuration: sudo sshd -t
# Apply hardening: sudo systemctl reload ssh || sudo systemctl reload sshd

[template:/etc/ssh/sshd_config.d/99-hardened.conf:once]
# OpenSSH Server Hardening Baseline
# Ensure your public key is in ~/.ssh/authorized_keys before reloading sshd!
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
# AllowTcpForwarding is enabled for intentional port forwarding (ssh -L/-R/-D tunnels)
AllowTcpForwarding yes
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 10
MaxStartups 10:30:100
ClientAliveInterval 300
ClientAliveCountMax 2
