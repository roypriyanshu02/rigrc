[package]
name = ssh
binaries = ssh, ssh-keygen
description = OpenSSH client configuration
scope = system
apt = openssh-client
dnf = openssh-clients
pacman = openssh
optional = true

post = mkdir -p -m 700 ~/.ssh ~/.ssh/config.d 2>/dev/null || true; [ -f ~/.ssh/config ] && chmod 600 ~/.ssh/config 2>/dev/null || true

[template:~/.ssh/config:once]
Include ~/.ssh/config.d/*

Host *
    AddKeysToAgent yes
    IdentitiesOnly yes
    HashKnownHosts yes
    ServerAliveInterval 60
    ServerAliveCountMax 3
