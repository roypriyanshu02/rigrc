[package]
name = cloudflared
binaries = cloudflared
description = Cloudflare Tunnel client
scope = system
apt = cloudflared
dnf = cloudflared
pacman = cloudflared
apt.prep = [ -f /usr/share/keyrings/cloudflare-main.gpg ] || (sudo mkdir -p --mode=0755 /usr/share/keyrings && curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null && echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null && sudo apt update)
dnf.prep = curl -fsSL https://pkg.cloudflare.com/cloudflared.repo | sudo tee /etc/yum.repos.d/cloudflared.repo
pacman.prep = sudo pacman -Syu --noconfirm
cond = vps,!wsl,!container
optional = true

[template:~/.cloudflared/config.yml:once]
# Cloudflare Tunnel Baseline Ingress Scaffold
# tunnel: YOUR_TUNNEL_ID
# credentials-file: ~/.cloudflared/YOUR_TUNNEL_ID.json
ingress:
  # - hostname: app.example.com
  #   service: http://localhost:8080
  - service: http_status:404
