[package]
name = ufw
binaries = ufw
description = Firewall manager
scope = system
apt = ufw
dnf = ufw
pacman = ufw
cond = vps,!wsl,!container
optional = true
post = (sudo ufw allow OpenSSH 2>/dev/null || sudo ufw allow 22/tcp 2>/dev/null || true) && (command -v mosh-server >/dev/null 2>&1 && sudo ufw allow 60000:61000/udp 2>/dev/null || true) && sudo ufw default deny incoming && sudo ufw default allow outgoing && sudo ufw logging low && (sudo ufw --force enable 2>/dev/null || true)
