[package]
name = caddy
binaries = caddy
description = Web server with automatic HTTPS
scope = system
apt = caddy
dnf = caddy
pacman = caddy
apt.prep = [ -f /usr/share/keyrings/caddy-stable-archive-keyring.gpg ] || (sudo apt update && sudo apt install -y curl gnupg && curl -fsSL 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg && curl -fsSL 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list > /dev/null && sudo chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list && sudo apt update)
dnf.prep = (sudo dnf install -y dnf5-plugins 2>/dev/null || sudo dnf install -y dnf-plugins-core 2>/dev/null || true) && sudo dnf copr enable -y @caddy/caddy
pacman.prep = sudo pacman -Syu --noconfirm
cond = vps,!wsl,!container
optional = true

[template:~/.config/caddy/Caddyfile:once]
{
	admin localhost:2019
}

# Example Reverse Proxy Site Block:
# example.com {
# 	reverse_proxy 127.0.0.1:8080
# 	encode zstd gzip
# 	header {
# 		Strict-Transport-Security "max-age=31536000;"
# 		X-Content-Type-Options "nosniff"
# 		X-Frame-Options "DENY"
# 		-Server
# 	}
# }

[bashrc]
if command -v caddy >/dev/null 2>&1; then
    _eval_cached caddy caddy completion-script bash 2>/dev/null || true
fi
