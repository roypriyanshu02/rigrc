[package]
name = tailscale
binaries = tailscale
description = Zero-config mesh VPN based on WireGuard
scope = system
cmd = curl -fsSL https://tailscale.com/install.sh | sudo sh
optional = true

[bashrc]
if command -v tailscale >/dev/null 2>&1; then
    _eval_cached tailscale tailscale completion bash 2>/dev/null || true
fi
