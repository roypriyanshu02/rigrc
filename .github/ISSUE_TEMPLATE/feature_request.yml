name: Feature request
description: Suggest an improvement, new script option, engine capability, or workflow feature
title: "[ENHANCEMENT] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: "A clear and concise description of what the problem is."
      placeholder: "e.g. Bootstrapping in air-gapped environments fails when checking remote URLs, no command to verify template syntax without executing"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: "A clear description of what you want to happen. If proposing a new script flag or configuration directive:"
      value: |
        - **Proposed Script Option / Syntax:** (e.g., `./rigrc.sh --offline`, `scope = container`)
        - **Target Output / Behavior:** (e.g., skip network checks, suppress sudo elevation)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternative solutions, custom hooks, or manual workarounds you have considered."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: "Add any other context, mockup terminal outputs, or reference implementations."
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions to make sure this is not already proposed.
          required: true
