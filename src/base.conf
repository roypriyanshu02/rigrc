# src/base.conf: Base defaults and shell templates
# ==============================================================================

[config]
# Base global configuration defaults
# INSTALL_GROUPS = core, shell, sys-info, utilities, dev-tools, security-and-net, package-managers, runtimes, ai-agents

# Manual Condition Overrides (comma-separated conditions to force enable or disable)
# COND = container, wsl       # Force-enable conditions manually
# DISABLE_COND = container    # Force-disable conditions manually
COND =
DISABLE_COND =

[template:.profile]
# ~/.profile: sourced by POSIX login shells

# ── Environment Baseline ──────────────────────────────────────────────────────
if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/shell/env.sh" ]; then
    . "${XDG_CONFIG_HOME:-$HOME/.config}/shell/env.sh"
elif [ -f "$HOME/.config/shell/env.sh" ]; then
    . "$HOME/.config/shell/env.sh"
fi

[template:.bash_profile]
# ~/.bash_profile: sourced by bash login shells
if [ -f "$HOME/.profile" ]; then
    . "$HOME/.profile"
fi
case $- in
    *i*)
        if [ -n "$BASH_VERSION" ] && [ -f "$HOME/.bashrc" ]; then
            . "$HOME/.bashrc"
        fi
        ;;
esac

[template:.bashrc]
# ~/.bashrc: sourced by interactive bash shells

# ── 1. Non-Interactive Guard ──────────────────────────────────────────────────
case $- in
    *i*) ;;
      *) return;;
esac

# ── 2. Interactive Environment Fallback ───────────────────────────────────────
if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/shell/env.sh" ]; then
    . "${XDG_CONFIG_HOME:-$HOME/.config}/shell/env.sh"
elif [ -f "$HOME/.config/shell/env.sh" ]; then
    . "$HOME/.config/shell/env.sh"
fi

# ── 3. Shell Options (shopt) ─────────────────────────────────────────────────
[ "${MACHINE_ENV:-desktop}" != "vps" ] && shopt -s autocd 2>/dev/null
shopt -s cdspell 2>/dev/null
shopt -s dirspell 2>/dev/null
shopt -s checkwinsize 2>/dev/null
shopt -s histappend 2>/dev/null
shopt -s cmdhist 2>/dev/null
shopt -s lithist 2>/dev/null
shopt -s globstar 2>/dev/null
shopt -s extglob 2>/dev/null
shopt -s histreedit 2>/dev/null
shopt -s histverify 2>/dev/null
shopt -s no_empty_cmd_completion 2>/dev/null

# ── Shell Init Caching Helper ────────────────────────────────────────────────
_eval_cached() {
    local cache_key="$1"; shift
    [ $# -gt 0 ] || return 0
    local cmd="$1"
    local bin; bin="$(command -v "$cmd" 2>/dev/null || echo "$HOME/.local/bin/$cmd")"
    [ -x "$bin" ] || return 0

    local cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/shell"
    local cache_file="$cache_dir/$cache_key.sh"
    mkdir -p -m 700 "$cache_dir" 2>/dev/null
    if [ ! -s "$cache_file" ] || [ "$bin" -nt "$cache_file" ]; then
        local tmp
        tmp="$(mktemp "${cache_file}.XXXXXX" 2>/dev/null)" || return 0
        chmod 600 "$tmp" 2>/dev/null
        if "$@" > "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
            mv -f "$tmp" "$cache_file" 2>/dev/null
        else
            rm -f "$tmp" 2>/dev/null
            return 0
        fi
    fi
    # Security check: verify owner and strict 600 permissions before sourcing
    if [ -f "$cache_file" ]; then
        if [ -O "$cache_file" ]; then
            local perm
            perm="$(stat -c '%a' "$cache_file" 2>/dev/null || stat -f '%Lp' "$cache_file" 2>/dev/null)"
            case "$perm" in
                600) . "$cache_file" ;;
            esac
        fi
    fi
}

# ── Programmable Completion Sourcing ──────────────────────────────────────────
if ! shopt -oq posix; then
  if [ -f /usr/share/bash-completion/bash_completion ]; then
    . /usr/share/bash-completion/bash_completion
  elif [ -f /etc/bash_completion ]; then
    . /etc/bash_completion
  fi
fi

# ── 4. History Configuration ──────────────────────────────────────────────────
export HISTCONTROL=ignoreboth:erasedups
export HISTSIZE=100000
export HISTFILESIZE=200000
HISTIGNORE="&:[bf]g:exit:quit:clear:pwd:ls:ll:la:cl:history"
HISTTIMEFORMAT="%F %T "
PROMPT_COMMAND="history -a${PROMPT_COMMAND:+; $PROMPT_COMMAND}"

# ── 5. Security & Permissions ─────────────────────────────────────────────────
umask 022
ulimit -S -c 0 2>/dev/null
ulimit -n 65536 2>/dev/null || ulimit -n 4096 2>/dev/null

# ── 6. Performance & Subshell Optimizations ──────────────────────────────────
unset MAILCHECK

[template:.inputrc]
# ~/.inputrc: GNU Readline configuration
$include /etc/inputrc

# ── Completion Settings ───────────────────────────────────────────────────────
set completion-ignore-case on
set completion-map-case on
set show-all-if-ambiguous on
set show-all-if-unmodified on
set menu-complete-display-prefix on
set colored-stats on
set colored-completion-prefix on
set visible-stats on
set mark-symlinked-directories on
set match-hidden-files off
set skip-completed-text on
set echo-control-characters off
set bell-style none
set expand-tilde on

# ── Keybindings ───────────────────────────────────────────────────────────────
# History search with Up/Down arrows based on typed prefix
"\e[A": history-search-backward
"\e[B": history-search-forward

# Word navigation: Ctrl+Left/Right & Alt+Left/Right
"\e[1;5C": forward-word
"\e[1;5D": backward-word
"\e[1;3C": forward-word
"\e[1;3D": backward-word

# Menu completion backward (Shift-Tab)
"\e[Z": menu-complete-backward

[template:~/.config/shell/detect.sh:once]
# ~/.config/shell/detect.sh: Environment and OS context detection

# ── 1. Orthogonal Container Detection ─────────────────────────────────────────
if [ -f /.dockerenv ] || [ -f /run/.containerenv ] || grep -qE '(docker|containerd|kubepods)' /proc/1/cgroup 2>/dev/null || { command -v systemd-detect-virt >/dev/null 2>&1 && systemd-detect-virt --container >/dev/null 2>&1; }; then
    export IS_CONTAINER=1
fi

# ── 2. Machine Environment Detection (wsl | vps | desktop) ────────────────────
if [ -n "${WSL_DISTRO_NAME:-}" ] || [ -n "${WSL_INTEROP:-}" ] || grep -qi microsoft /proc/version 2>/dev/null; then
    export IS_WSL=1
    export MACHINE_ENV="wsl"
    [ -e /proc/sys/fs/binfmt_misc/WSLInterop ] && export WSL_INTEROP_AVAILABLE=1
    if command -v systemctl >/dev/null 2>&1 && systemctl is-system-running >/dev/null 2>&1; then
        export WSL_SYSTEMD=1
    fi
elif [ -f /etc/cloud/cloud.cfg ] || [ -f /etc/digitalocean ] || [ -d /etc/oracle-cloud-agent ] || { command -v systemd-detect-virt >/dev/null 2>&1 && systemd-detect-virt --vm >/dev/null 2>&1; } || [ -n "${SSH_CONNECTION:-}" ] || [ -n "${SSH_CLIENT:-}" ] || [ -n "${SSH_TTY:-}" ] || { ! command -v xset >/dev/null 2>&1 && [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; }; then
    export MACHINE_ENV="vps"
else
    export MACHINE_ENV="desktop"
fi

[template:~/.config/shell/env.sh:once]
# ~/.config/shell/env.sh: Baseline environment variables (exports only)

if [ -z "${_SHELL_ENV_LOADED:-}" ]; then
    if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/shell/detect.sh" ]; then
        . "${XDG_CONFIG_HOME:-$HOME/.config}/shell/detect.sh"
    fi

    # ── XDG Base Directory Specification ──────────────────────────────────────────
    export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
    export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
    export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
    export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
    export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"

    # ── PATH Assembly (Deduplicated) ──────────────────────────────────────────────
    _add_to_path() {
        case ":$PATH:" in
            *:"$1":*) ;;
            *) [ -d "$1" ] && PATH="$1:$PATH" ;;
        esac
    }
    _add_to_path "$XDG_BIN_HOME"
    _add_to_path "$HOME/.local/bin"
    _add_to_path "$HOME/bin"
    _add_to_path "/usr/local/bin"
    _add_to_path "/usr/local/sbin"
    export PATH

    # ── Editor & Visual Settings ─────────────────────────────────────────────────
    export EDITOR="${EDITOR:-vi}"
    export VISUAL="${VISUAL:-$EDITOR}"

    # ── Pager & Search Settings ───────────────────────────────────────────────────
    export PAGER="less"
    export LESS="-R -F -X -i -M"

    # ── Locale Settings ───────────────────────────────────────────────────────────
    export LANG="${LANG:-C.UTF-8}"

    # ── Color & Terminal Capabilities ─────────────────────────────────────────────
    if [ -t 0 ]; then
        if [ -n "${COLORTERM:-}" ] || [ "${TERM:-}" = "xterm-256color" ] || [ "${TERM:-}" = "screen-256color" ]; then
            export COLORTERM="${COLORTERM:-truecolor}"
        fi
    fi

    export _SHELL_ENV_LOADED=1
fi

# Source interactive modules if shell is interactive
case "$-" in
    *i*)
        [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/shell/functions.sh" ] && . "${XDG_CONFIG_HOME:-$HOME/.config}/shell/functions.sh"
        [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/shell/aliases.sh" ] && . "${XDG_CONFIG_HOME:-$HOME/.config}/shell/aliases.sh"
        ;;
esac

[template:~/.config/shell/functions.sh:once]
# ~/.config/shell/functions.sh: Shell helper functions

# ── Universal Archive Extractor ───────────────────────────────────────────────
extract() {
    if [ -z "$1" ]; then
        echo "Usage: extract <filename>"
        return 1
    fi
    if [ ! -f "$1" ]; then
        echo "'$1' is not a valid file"
        return 1
    fi
    case "$1" in
        *.tar.bz2|*.tbz2) tar xjf "$1" ;;
        *.tar.gz|*.tgz)   tar xzf "$1" ;;
        *.tar.xz|*.txz)   tar xJf "$1" ;;
        *.tar.zst)        tar --zstd -xf "$1" 2>/dev/null || zstd -d -c "$1" | tar xf - ;;
        *.bz2)            bunzip2 "$1" ;;
        *.rar)            unrar x "$1" 2>/dev/null || 7z x "$1" ;;
        *.gz)             gunzip "$1" ;;
        *.tar)            tar xf "$1" ;;
        *.zip)            unzip "$1" ;;
        *.Z)              uncompress "$1" ;;
        *.7z)             7z x "$1" ;;
        *.xz)             xz -d "$1" ;;
        *.zst)            zstd -d "$1" ;;
        *)                echo "'$1' cannot be extracted via extract()" && return 1 ;;
    esac
}

mkcd() { mkdir -p -- "$1" && cd -P -- "$1"; }

[template:~/.config/shell/aliases.sh:once]
# ~/.config/shell/aliases.sh: Base interactive shell aliases

# Baseline core utils (individual package aliases injected dynamically via package manifests)
alias ls='ls --color=auto --group-directories-first 2>/dev/null || ls --color=auto'
alias ll='ls -alF'
alias la='ls -A'
alias l='ls -CF'
alias rm='rm -i'
alias diff='diff --color=auto'
alias grep='grep --color=auto'
alias fgrep='fgrep --color=auto'
alias egrep='egrep --color=auto'

# DX & Safety Aliases
alias ip='ip --color=auto'
alias ..='cd ..'
alias ...='cd ../..'
alias ....='cd ../../..'
alias cp='cp -i'
alias mv='mv -i'
alias mkdir='mkdir -p'
alias reload='exec $SHELL -l'
alias please='sudo $(fc -ln -1 2>/dev/null)'
alias ports='sudo ss -tulpn 2>/dev/null || ss -tulpn'

# WSL Quality-of-Life Interop Helpers
if [ -n "$IS_WSL" ]; then
    if command -v explorer.exe >/dev/null 2>&1; then alias open='explorer.exe'; fi
    if command -v clip.exe >/dev/null 2>&1; then alias pbcopy='clip.exe'; fi
    if command -v powershell.exe >/dev/null 2>&1; then alias pbpaste='powershell.exe -NoProfile -Command Get-Clipboard'; fi
fi
